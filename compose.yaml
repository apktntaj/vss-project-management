services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vss-pm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vss_dev_password
    ports:
      - "5432:5432"
    volumes:
      - vss_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vss-pm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vss_postgres_data:
